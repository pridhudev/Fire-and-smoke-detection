<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Fire Detection - AI Powered Monitoring System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff6b35;
      --secondary-color: #f7931e;
      --accent-color: #4ecdc4;
      --dark-bg: #0a0a0a;
      --dark-surface: #1a1a1a;
      --dark-card: #2a2a2a;
      --dark-text: #ffffff;
      --dark-text-secondary: #b0b0b0;
      --light-bg: #ffffff;
      --light-surface: #f8f9fa;
      --light-card: #ffffff;
      --light-text: #2c3e50;
      --light-text-secondary: #6c757d;
      --gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
      --shadow-hover: 0 20px 40px rgba(0,0,0,0.15);
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-color: var(--dark-bg);
      --surface-color: var(--dark-surface);
      --card-color: var(--dark-card);
      --text-color: var(--dark-text);
      --text-secondary: var(--dark-text-secondary);
      --border-color: #333;
    }

    [data-theme="light"] {
      --bg-color: var(--light-bg);
      --surface-color: var(--light-surface);
      --card-color: var(--light-card);
      --text-color: var(--light-text);
      --text-secondary: var(--light-text-secondary);
      --border-color: #e9ecef;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      transition: var(--transition);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--card-color);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .logo i {
      font-size: 2rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      transition: var(--transition);
    }

    .nav-links a:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }

    .theme-toggle {
      background: var(--surface-color);
      border: 2px solid var(--border-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-color);
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: rotate(180deg) scale(1.1);
      border-color: var(--primary-color);
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
    }

    .logout-btn {
      background: transparent;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }

    /* Main Content */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      min-height: calc(100vh - 160px);
    }

    .hero {
      text-align: center;
      margin-bottom: 4rem;
      padding: 4rem 0;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Cards */
    .detection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .card {
      background: var(--card-color);
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .card-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
    }

    .card h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-color);
    }

    /* Forms */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-color);
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--surface-color);
      color: var(--text-color);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      justify-content: center;
    }

    .btn-primary {
      background: var(--gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
    }

    .btn-secondary {
      background: var(--surface-color);
      color: var(--text-color);
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .btn-full {
      width: 100%;
    }

    /* Image Results */
    .img-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }

    .img-result {
      text-align: center;
    }

    .img-result h3 {
      margin-bottom: 1rem;
      color: var(--text-color);
      font-weight: 600;
    }

    .img-result img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border-color);
      transition: var(--transition);
    }

    .img-result img:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    /* Stream Container */
    .stream-container {
      text-align: center;
      margin-top: 2rem;
      padding: 2rem;
      background: var(--surface-color);
      border-radius: var(--border-radius);
      border: 2px dashed var(--border-color);
    }

    .stream-container img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    /* Real-time Section */
    .realtime-section {
      text-align: center;
      padding: 3rem;
      background: var(--surface-color);
      border-radius: var(--border-radius);
      margin-top: 2rem;
    }

    /* Auth Forms */
    .auth-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .auth-form {
      background: var(--card-color);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      margin: 2rem;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
    }

    .auth-toggle a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }

    /* Footer */
    .footer {
      background: var(--card-color);
      border-top: 1px solid var(--border-color);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-secondary);
    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    .footer-links a:hover {
      color: var(--primary-color);
    }

    /* Loading */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav {
        padding: 0 1rem;
        flex-wrap: wrap;
        height: auto;
        min-height: 80px;
      }

      .nav-links {
        display: none;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .detection-grid {
        grid-template-columns: 1fr;
      }

      .img-container {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 1rem;
      }
    }

    /* Hide main content when not authenticated */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body data-theme="dark">
  <main class="main">
    <section class="hero">
      <h1>Fire And Smoke Detection</h1>
      <p>Upload an image and detect fire or smoke instantly.</p>
    </section>

    <div class="card image-panel">
      <div class="card-header">
        <div class="card-icon">
          <i class="fas fa-image"></i>
        </div>
        <h2>Image Detection</h2>
      </div>

      <form id="img-form" action="/upload_image" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="image-upload">Select Image File</label>
          <input type="file" id="image-upload" name="file" class="form-control" accept="image/*" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <i class="fas fa-search"></i>
          <span class="btn-text">Detect Fire</span>
          <span class="loading hidden"></span>
        </button>
      </form>

      <div class="img-container">
        <div class="img-result">
          <h3>Original Image</h3>
          <img id="orig-img" style="display: none;" />
          <div id="orig-placeholder" class="placeholder-box">
            <i class="fas fa-image"></i>
            Original image will appear here
          </div>
        </div>

        <div class="img-result">
          <h3>Detection Result</h3>
          <img id="result-img" style="display: none;" />
          <div id="result-placeholder" class="placeholder-box">
            <i class="fas fa-fire"></i>
            Detection result will appear here
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('img-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const file = e.target.querySelector('input[type="file"]').files[0];
      if (!file) {
        showNotification('Please select an image first.', 'error');
        return;
      }

      const btn = e.target.querySelector('button');
      const btnText = btn.querySelector('.btn-text');
      const loading = btn.querySelector('.loading');

      btnText.classList.add('hidden');
      loading.classList.remove('hidden');
      btn.disabled = true;

      const origImg = document.getElementById('orig-img');
      const origPlaceholder = document.getElementById('orig-placeholder');
      origImg.src = URL.createObjectURL(file);
      origImg.style.display = 'block';
      origPlaceholder.style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/upload_image', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          throw new Error(`Server error: ${res.status} ${res.statusText}`);
        }

        const blob = await res.blob();
        const resultImg = document.getElementById('result-img');
        const resultPlaceholder = document.getElementById('result-placeholder');
        resultImg.src = URL.createObjectURL(blob);
        resultImg.style.display = 'block';
        resultPlaceholder.style.display = 'none';

        showNotification('Image processed successfully!', 'success');
      } catch (err) {
        console.error('Image processing error:', err);
        showNotification('Image detection failed. Please try again.', 'error');

        const resultImg = document.getElementById('result-img');
        const resultPlaceholder = document.getElementById('result-placeholder');
        resultImg.style.display = 'none';
        resultPlaceholder.style.display = 'block';
      } finally {
        btnText.classList.remove('hidden');
        loading.classList.add('hidden');
        btn.disabled = false;
      }
    });

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 1rem 1.5rem;
        background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#ff6b35'};
        color: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        z-index: 9999;
        transform: translateX(400px);
        transition: all 0.3s ease;
        max-width: 300px;
      `;

      notification.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i><span>${message}</span></div>`;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.style.transform = 'translateX(0)';
      }, 100);

      setTimeout(() => {
        notification.style.transform = 'translateX(400px)';
        setTimeout(() => {
          if (notification.parentNode) {
            notification.parentNode.removeChild(notification);
          }
        }, 300);
      }, 3000);
    }
  </script>
</body>
</html>
